name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: behaviorpulse
          POSTGRES_PASSWORD: behaviorpulse
          POSTGRES_DB: behaviorpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://behaviorpulse:behaviorpulse@localhost:5432/behaviorpulse
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  frontend-ci:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        # TODO: drop continue-on-error once the two pre-existing
        # react-hooks/set-state-in-effect errors in PipelineAnimation and
        # ServiceDemo are reviewed and either fixed or explicitly accepted.
        # Left non-blocking for now rather than silently ignored - this
        # step still shows failed in the Actions UI either way.
        run: npx eslint .
        continue-on-error: true

  deploy-backend:
    name: Deploy backend to Render
    needs: backend-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"