services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: behaviorpulse
      POSTGRES_PASSWORD: behaviorpulse
      POSTGRES_DB: behaviorpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U behaviorpulse"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://behaviorpulse:behaviorpulse@db:5432/behaviorpulse
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata: